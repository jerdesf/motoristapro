<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/car-icon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/manifest.json?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MotoristaPRO" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0d14" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Controle financeiro e projeção inteligente para motoristas de aplicativo" />
    <title>MotoristaPRO — Controle de Ganhos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          // Limpa chaves permanentes de versões anteriores
          localStorage.removeItem('theme');
          localStorage.removeItem('motoristapro_theme');
          
          // Se todas as abas foram fechadas, sessionStorage é nulo -> volta automaticamente para o tema do sistema
          var sessionTheme = sessionStorage.getItem('motoristapro_session_theme');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = sessionTheme === 'dark' || ((!sessionTheme || sessionTheme === 'system') && systemDark);
          
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }

          var targetColor = isDark ? '#0a0d14' : '#ffffff';
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          if (metas.length > 0) {
            metas.forEach(function(m) {
              m.removeAttribute('media');
              m.setAttribute('content', targetColor);
            });
          }

          var appleStatus = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (appleStatus) {
            appleStatus.setAttribute('content', isDark ? 'black-translucent' : 'default');
          }
        } catch (e) {}

        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').catch(function() {});
          });
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#0a0d14] dark:text-slate-100 antialiased selection:bg-emerald-500 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
